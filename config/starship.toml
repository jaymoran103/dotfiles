# Starship prompt — https://starship.rs/config
# Plain-text symbols only: NO Nerd Font required. Renders identically on any
# monospace font, macOS or Linux.

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " ro"

[git_branch]
symbol = ""
style = "bold purple"
format = "[$branch]($style) "

[git_status]
style = "bold yellow"
conflicted = "="
ahead = "^${count}"
behind = "v${count}"
diverged = "^${ahead_count}v${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "dimmed yellow"

[nodejs]
symbol = "node "
format = "[$symbol($version )]($style)"
style = "green"

[python]
symbol = "py "
format = "[$symbol($version )]($style)"
style = "yellow"
